<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f8f4e9;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: inline-block;
            padding: 40px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
            margin: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
            background: linear-gradient(135deg, #4a90e2, #6a5acd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #5a6a7e;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s;
            background-color: #f9f9f9;
        }
        input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }
        button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #4a90e2, #6a5acd);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.3);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 18px;
            background-color: #f8fafc;
            color: #2c3e50;
        }
        .bmi-value {
            font-weight: 700;
            font-size: 24px;
            margin: 10px 0;
            display: inline-block;
            background: linear-gradient(135deg, #4a90e2, #6a5acd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status {
            font-weight: 500;
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-size: 16px;
        }
        .underweight {
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            color: #2c5282;
        }
        .normal {
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
            color: #22543d;
        }
        .overweight {
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #7b341e;
        }
        .obese {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #63171b;
        }
        .info-text {
            font-size: 14px;
            color: #718096;
            margin-top: 24px;
            line-height: 1.5;
        }
        .footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            color: #718096;
            text-align: center;
            width: 100%;
        }
        .footer a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer a:hover {
            color: #3a7bc8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>BMI Calculator</h2>
    
    <div class="input-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="e.g. 68.5">
    </div>
    
    <div class="input-group">
        <label for="height">Height (m)</label>
        <input type="number" step="0.01" id="height" placeholder="e.g. 1.75">
    </div>
    
    <button onclick="calculateBMI()">Calculate BMI</button>

    <div class="result" id="result"></div>
    
    <p class="info-text">
        BMI (Body Mass Index) is a measure of body fat based on height and weight.
        Normal range: 18.5 - 24.9
    </p>
</div>

<div class="footer">
    &copy; Samuel Sawyer J | URK23CS1136 | WebTechnology Lab
</div>

<script>
function calculateBMI() {
    let weight = parseFloat(document.getElementById('weight').value);
    let height = parseFloat(document.getElementById('height').value);

    if (isNaN(weight) || isNaN(height) || height <= 0) {
        document.getElementById('result').innerHTML = 
            "Please enter valid weight and height values.";
        return;
    }

    let bmi = weight / (height * height);
    let status = "";
    let statusClass = "";

    if (bmi < 18.5) {
        status = "Underweight";
        statusClass = "underweight";
    } else if (bmi >= 18.5 && bmi < 25) {
        status = "Normal weight";
        statusClass = "normal";
    } else if (bmi >= 25 && bmi < 30) {
        status = "Overweight";
        statusClass = "overweight";
    } else {
        status = "Obese";
        statusClass = "obese";
    }

    document.getElementById('result').innerHTML = 
        `<div>Your BMI is</div>
         <div class="bmi-value">${bmi.toFixed(1)}</div>
         <div class="status ${statusClass}">${status}</div>`;
}

// Automatically update copyright year
document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
